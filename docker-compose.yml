services:
  role-sync:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - role_sync_state:/data
    environment:
      STATE_FILE: /data/state.json
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  role_sync_state:
