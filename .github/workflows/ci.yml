name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Run syntax check
        run: npm run check
      - name: Print npm lockfile for maintainer verification
        run: |
          echo 'LOCK_BEGIN'
          base64 -w0 package-lock.json
          echo
          echo 'LOCK_END'
